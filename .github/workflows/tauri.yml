name: "Build Tauri App"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag suffix to build, e.g. "-tg.1"'
        required: false
        default: ''

jobs:
  # Windows-x86_64
  windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable # They use branch based releases
      - name: Install cinny dependencies
        run: cd cinny && npm ci
      - name: Install tauri dependencies
        run: npm ci
      - name: Build desktop app with Tauri
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=4096"
        with:
          args: --verbose
      - name: Rename msi installer
        shell: pwsh
        run: |
          $dir = "src-tauri\target\release\bundle\msi"
          if (-not (Test-Path $dir)) { throw "MSI bundle directory not found: $dir" }
          $msi = Get-ChildItem -Path $dir -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No .msi installer found in $dir" }
          Move-Item -Path $msi.FullName -Destination (Join-Path $dir "Cinny_desktop-x86_64.msi") -Force
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cinny-windows-x86_64${{ inputs.tag }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # Linux-x86_64
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable # They use branch based releases
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install cinny dependencies
        run: cd cinny && npm ci
      - name: Install tauri dependencies
        run: npm ci
      - name: Build desktop app with Tauri
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=4096"
        with:
          args: --verbose
      - name: Rename deb
        run: |
          set -euo pipefail
          dir="src-tauri/target/release/bundle/deb"
          deb=$(find "$dir" -maxdepth 1 -name '*.deb' -print -quit 2>/dev/null || true)
          if [ -z "$deb" ]; then echo "No .deb package found in $dir" >&2; exit 1; fi
          mv "$deb" "$dir/Cinny_desktop-x86_64.deb"
      - name: Rename AppImage
        run: |
          set -euo pipefail
          dir="src-tauri/target/release/bundle/appimage"
          appimage=$(find "$dir" -maxdepth 1 -name '*.AppImage' -print -quit 2>/dev/null || true)
          if [ -z "$appimage" ]; then echo "No .AppImage found in $dir" >&2; exit 1; fi
          mv "$appimage" "$dir/Cinny_desktop-x86_64.AppImage"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cinny-linux-x86_64${{ inputs.tag }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # macos-universal
  macos-universal:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable # They use branch based releases
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install cinny dependencies
        run: cd cinny && npm ci
      - name: Install tauri dependencies
        run: npm ci
      - name: Build desktop app with Tauri
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=4096"
        with:
          args: --target universal-apple-darwin --verbose
      - name: Rename dmg
        run: |
          set -euo pipefail
          dir="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          dmg=$(find "$dir" -maxdepth 1 -name '*.dmg' -print -quit 2>/dev/null || true)
          if [ -z "$dmg" ]; then echo "No .dmg found in $dir" >&2; exit 1; fi
          mv "$dmg" "$dir/Cinny_desktop-universal.dmg"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cinny-macos-universal${{ inputs.tag }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny.app
          if-no-files-found: warn
