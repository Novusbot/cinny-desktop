name: "Windows build"

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup node
        timeout-minutes: 10
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@stable # They use branch based releases
      - name: Install cinny dependencies
        timeout-minutes: 15
        run: cd cinny && npm ci
      - name: Install tauri dependencies
        timeout-minutes: 15
        run: npm ci
      - name: Build desktop app with Tauri
        timeout-minutes: 45
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=4096"
        with:
          args: --verbose
      - name: Rename msi installer
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dir = "src-tauri\target\release\bundle\msi"
          if (-not (Test-Path $dir)) { throw "MSI bundle directory not found: $dir" }
          $msi = Get-ChildItem -Path $dir -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No .msi installer found in $dir" }
          Move-Item -Path $msi.FullName -Destination (Join-Path $dir "Cinny_desktop-x86_64.msi") -Force
      - name: Upload Windows artifacts
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cinny-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
